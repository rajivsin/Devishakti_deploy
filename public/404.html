<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>18 Shakti Peetha Devis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var base = '/Devishakti_deploy/';
        var path = window.location.pathname;
        if (path.indexOf(base) === 0) {
          var rest = path.substring(base.length).replace(/\/+$/, '');
          if (rest) {
            window.location.replace(base + '#' + rest);
            return;
          }
        }
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
